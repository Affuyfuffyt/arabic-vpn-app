name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Smart Fix & Auto-Find Working VPN Library
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        include ':app'
        EOF
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.4' apply false
            id 'com.android.library' version '8.1.4' apply false
            id 'org.jetbrains.kotlin.android' version '1.8.22' apply false
        }
        EOF
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF
        cat << 'EOF' > init.gradle
        allprojects {
            repositories {
                google()
                mavenCentral()
                maven { url 'https://jitpack.io' }
            }
        }
        EOF
        
        echo "Searching JitPack for a working OpenVPN version..."
        SUCCESS=0
        for user in "schwabe" "arneschwabe"; do
          for version in "0.7.64" "0.7.63" "0.7.62" "0.7.60" "0.7.50" "master-SNAPSHOT"; do
            echo "Testing $user:$version..."
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://jitpack.io/com/github/$user/ics-openvpn/$version/ics-openvpn-$version.pom")
            if [ "$status" = "200" ]; then
              echo "✅ Success! Found working version: $version"
              find . -type f -name "build.gradle" -exec sed -i "s/ics-openvpn:0.7.64/ics-openvpn:$version/g" {} +
              find . -type f -name "build.gradle" -exec sed -i "s/ics-openvpn:v0.7.64/ics-openvpn:$version/g" {} +
              find . -type f -name "build.gradle" -exec sed -i "s/com.github.schwabe/com.github.$user/g" {} +
              SUCCESS=1
              break
            fi
          done
          if [ "$SUCCESS" = "1" ]; then break; fi
        done

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug --init-script init.gradle --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VPN-App
        path: '**/*.apk'
