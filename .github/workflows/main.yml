name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Fix Files & Version Typo
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        include ':app'
        EOF
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.4' apply false
            id 'com.android.library' version '8.1.4' apply false
            id 'org.jetbrains.kotlin.android' version '1.8.22' apply false
        }
        EOF
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF
        cat << 'EOF' > init.gradle
        allprojects {
            repositories {
                google()
                mavenCentral()
                jcenter()
                maven { url 'https://jitpack.io' }
            }
        }
        EOF
        
        # هذا السطر سيبحث عن الإصدار الخاطئ ويصلحه تلقائياً
        find . -type f -name "build.gradle" -exec sed -i 's/v0.7.64/0.7.64/g' {} +

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug --init-script init.gradle

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VPN-App
        path: '**/*.apk'
